<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Per-page tags. vite.config.js fills these for "/" and writes one copy of this page per module
         (e.g. dist/genai/index.html) so LinkedIn, WhatsApp, Slack and X show the right preview card. -->
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <link rel="canonical" href="%PAGE_URL%" />

    <!-- Link preview card for LinkedIn, WhatsApp, Slack and X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeArena" />
    <meta property="og:url" content="%PAGE_URL%" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:ital,wght@0,400..700;1,400..500&family=JetBrains+Mono:wght@400..600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
