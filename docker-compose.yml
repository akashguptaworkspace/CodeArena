version: '3.8'

services:
  backend:
    build:
      context: ./codearena-backend
      dockerfile: Dockerfile
    container_name: codearena-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_ORIGINS=${CLIENT_ORIGINS:-https://codearena.vedantaa.in}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_LOGGING=false
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - COOKIE_SECURE=${COOKIE_SECURE}
    restart: unless-stopped
    networks:
      - codearena-network

  frontend:
    build:
      context: ./codearena-frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_URL=${VITE_APP_URL:-https://codearena.vedantaa.in}
        - VITE_API_URL=${VITE_API_URL:-https://backend.codearena.vedantaa.in}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_ENABLE_PAYWALL=${VITE_ENABLE_PAYWALL:-false}
        - VITE_PRESENCE_URL=${VITE_PRESENCE_URL:-wss://backend.codearena.vedantaa.in/presence}
    container_name: codearena-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codearena-network

networks:
  codearena-network:
    driver: bridge
